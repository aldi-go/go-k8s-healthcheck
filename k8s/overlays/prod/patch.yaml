apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-k8s-healthcheck
spec:
  # Prod: 3 replicas minimum for HA across nodes
  replicas: 3
  template:
    spec:
      containers:
      - name: server
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
