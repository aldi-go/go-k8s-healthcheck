apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-k8s-healthcheck
spec:
  replicas: 3
  template:
    spec:
      containers:
      - name: server
        env:
        - name: APP_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "info"
        - name: VERSION
          value: "1.0.0"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
